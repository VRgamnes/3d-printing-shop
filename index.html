<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Printing Shop</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      color: #ccc;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px;
    }

    section {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .print-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    .print-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    .no-image {
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ddd;
      color: #777;
      font-weight: bold;
    }

    .print-info {
      padding: 15px;
    }

    .print-info h3 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 15px;
      margin-top: 15px;
    }

    .button:hover {
      opacity: .85;
    }

    .order-type-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .order-type-box label {
      margin: 0;
      font-weight: normal;
      cursor: pointer;
    }

    .order-type-box input {
      width: auto;
      margin-right: 5px;
    }

    .choice-box {
      margin-top: 15px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 10px;
    }

    .hidden {
      display: none !important;
    }

    .success-message,
    .error-message,
    .error-box {
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .success-message {
      background: #e8f7e8;
      border: 1px solid #8ac98a;
    }

    .error-message,
    .error-box {
      background: #ffecec;
      border: 1px solid #e08a8a;
    }

    .tracking-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
    }

    .tracking-number,
    .tracking-status,
    .tracking-row {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid #eee;
    }

    .tracking-row:last-child {
      border-bottom: none;
    }

    .tracking-number span,
    .tracking-status span,
    .tracking-row span {
      color: #777;
    }

    @media (max-width: 600px) {

      main {
        padding: 15px;
      }

      section {
        padding: 18px;
      }

      .tracking-number,
      .tracking-status,
      .tracking-row {
        flex-direction: column;
        gap: 5px;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>3D Printing Shop</h1>

  <p>Choose a print or submit your own model.</p>

</header>


<main>


  <!-- =====================================================
       GALLERY
  ====================================================== -->

  <section>

    <h2>Gallery</h2>

    <div
      id="galleryGrid"
      class="gallery"
    >

      <p>Loading prints...</p>

    </div>

  </section>


  <!-- =====================================================
       ORDER FORM
  ====================================================== -->

  <section id="order">

    <h2>Place an Order</h2>

    <form id="orderForm">


      <label for="name">
        Your Name
      </label>

      <input
        id="name"
        name="name"
        type="text"
        required
      >


      <label for="contact">
        Email or Phone
      </label>

      <input
        id="contact"
        name="contact"
        type="text"
        required
      >


      <label>
        What would you like printed?
      </label>


      <div class="order-type-box">

        <label>

          <input
            type="radio"
            name="orderType"
            value="gallery"
            checked
          >

          Gallery Print

        </label>


        <label>

          <input
            type="radio"
            name="orderType"
            value="file"
          >

          Upload a File

        </label>


        <label>

          <input
            type="radio"
            name="orderType"
            value="idea"
          >

          I Have an Idea

        </label>


        <label>

          <input
            type="radio"
            name="orderType"
            value="link"
          >

          Model Link

        </label>

      </div>


      <!-- GALLERY -->

      <div
        id="galleryChoice"
        class="choice-box"
      >

        <label for="printSelect">
          Choose a print
        </label>

        <select
          id="printSelect"
          name="printId"
        >

          <option value="">
            Loading prints...
          </option>

        </select>

      </div>


      <!-- FILE -->

      <div
        id="fileChoice"
        class="choice-box hidden"
      >

        <label for="file">
          Upload your 3D model
        </label>

        <input
          id="file"
          name="file"
          type="file"
          accept=".stl,.3mf,.obj,.step,.stp"
        >

        <p>
          Maximum file size: 15 MB.
        </p>

      </div>


      <!-- IDEA -->

      <div
        id="ideaChoice"
        class="choice-box hidden"
      >

        <label for="idea">
          Describe your idea
        </label>

        <textarea
          id="idea"
          name="idea"
          placeholder="Tell us what you want printed..."
        ></textarea>

      </div>


      <!-- LINK -->

      <div
        id="linkChoice"
        class="choice-box hidden"
      >

        <label for="modelLink">
          Model link
        </label>

        <input
          id="modelLink"
          name="modelLink"
          type="url"
          placeholder="https://..."
        >

        <p>
          Paste a link to the 3D model you want printed.
        </p>

      </div>


      <!-- QUANTITY -->

      <label for="quantity">
        Quantity
      </label>

      <input
        id="quantity"
        name="quantity"
        type="number"
        min="1"
        value="1"
        required
      >


      <!-- FILAMENT -->

      <label for="typeSelect">
        Filament Type
      </label>

      <select
        id="typeSelect"
        name="filamentType"
        required
      >

        <option value="">
          Loading filament types...
        </option>

      </select>


      <!-- COLOR -->

      <label for="colorSelect">
        Filament Color
      </label>

      <select
        id="colorSelect"
        name="color"
        required
      >

        <option value="">
          Select filament type first
        </option>

      </select>


      <!-- NOTES -->

      <label for="notes">
        Notes
      </label>

      <textarea
        id="notes"
        name="notes"
        placeholder="Anything else we should know?"
      ></textarea>


      <button
        class="button"
        type="submit"
      >

        Submit Order

      </button>


      <div
        id="orderResult"
      ></div>


    </form>

  </section>


  <!-- =====================================================
       TRACK ORDER
  ====================================================== -->

  <section>

    <h2>Track Your Order</h2>

    <form id="trackForm">

      <label for="orderNumber">
        Order Number
      </label>

      <input
        id="orderNumber"
        name="orderNumber"
        type="text"
        placeholder="FF-1001"
        required
      >

      <button
        class="button"
        type="submit"
      >

        Track Order

      </button>

    </form>


    <div id="trackResult"></div>

  </section>


</main>


<script>


/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwXBlRSPgE_ufvIPhw9LqTdX95CW3YYjQcLajL4XcKAv6GbAKVErdYDiSrD0AXAK09_/exec";


/* =========================================================
   SHOP DATA
========================================================= */

let shopData = {
  gallery: [],
  inventory: []
};


/* =========================================================
   API FUNCTION
========================================================= */

async function api(action, data = {}) {

  const url =
    API_URL +
    "?action=" +
    encodeURIComponent(action) +
    "&data=" +
    encodeURIComponent(
      JSON.stringify(data)
    );


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "Could not connect to the shop server."
    );

  }


  return await response.json();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   LOAD SHOP
========================================================= */

async function loadShop() {

  const gallery =
    document.getElementById(
      "galleryGrid"
    );


  try {

    const response =
      await api("catalog");


    if (
      response.ok === false
    ) {

      throw new Error(
        response.error ||
        "Could not load shop."
      );

    }


    shopData = response;


    loadGallery();

    loadPrints();

    loadFilamentTypes();


  } catch (error) {

    gallery.innerHTML =
      "<div class='error-box'>" +

      "<h3>Shop unavailable</h3>" +

      "<p>" +

      escapeHTML(
        error.message
      ) +

      "</p>" +

      "</div>";


    console.error(error);

  }

}


/* =========================================================
   LOAD GALLERY
========================================================= */

function loadGallery() {

  const gallery =
    document.getElementById(
      "galleryGrid"
    );


  const prints =
    shopData.gallery || [];


  if (
    prints.length === 0
  ) {

    gallery.innerHTML =
      "<div>" +

      "<h3>No prints yet</h3>" +

      "<p>Add a print to the Gallery sheet.</p>" +

      "</div>";

    return;

  }


  gallery.innerHTML =
    prints.map(function(print) {

      let imageHTML;


      if (
        print.imageUrl
      ) {

        imageHTML =
          "<img src='" +
          escapeHTML(
            print.imageUrl
          ) +
          "' alt='" +
          escapeHTML(
            print.name
          ) +
          "'>";

      } else {

        imageHTML =
          "<div class='no-image'>" +
          "3D PRINT" +
          "</div>";

      }


      return (

        "<article class='print-card'>" +

          imageHTML +

          "<div class='print-info'>" +

            "<h3>" +

            escapeHTML(
              print.name
            ) +

            "</h3>" +

            "<p>" +

            escapeHTML(
              print.description || ""
            ) +

            "</p>" +

            "<button " +

            "type='button' " +

            "class='button order-print' " +

            "data-id='" +

            escapeHTML(
              print.id
            ) +

            "'>" +

            "Order this" +

            "</button>" +

          "</div>" +

        "</article>"

      );

    }).join("");


  document
    .querySelectorAll(
      ".order-print"
    )
    .forEach(function(button) {

      button.addEventListener(
        "click",
        function() {

          const galleryRadio =
            document.querySelector(
              "input[name='orderType'][value='gallery']"
            );


          galleryRadio.checked =
            true;


          updateOrderType();


          const printSelect =
            document.getElementById(
              "printSelect"
            );


          printSelect.value =
            button.dataset.id;


          document
            .getElementById("order")
            .scrollIntoView({
              behavior: "smooth"
            });

        }
      );

    });

}


/* =========================================================
   LOAD PRINT OPTIONS
========================================================= */

function loadPrints() {

  const select =
    document.getElementById(
      "printSelect"
    );


  select.innerHTML =
    "<option value=''>" +
    "Choose a print..." +
    "</option>";


  (shopData.gallery || [])
    .forEach(function(print) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        print.id;


      option.textContent =
        print.name;


      select.appendChild(
        option
      );

    });

}


/* =========================================================
   LOAD FILAMENT TYPES
========================================================= */

function loadFilamentTypes() {

  const select =
    document.getElementById(
      "typeSelect"
    );


  const types = [];


  (shopData.inventory || [])
    .forEach(function(item) {

      const available =
        String(item.inStock)
          .toLowerCase() !==
        "false";


      if (

        available &&

        item.type &&

        !types.includes(
          item.type
        )

      ) {

        types.push(
          item.type
        );

      }

    });


  select.innerHTML =
    "<option value=''>" +
    "Choose a type..." +
    "</option>";


  types.forEach(function(type) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      type;


    option.textContent =
      type;


    select.appendChild(
      option
    );

  });


  loadColors();

}


/* =========================================================
   LOAD COLORS
========================================================= */

function loadColors() {

  const type =
    document.getElementById(
      "typeSelect"
    ).value;


  const colorSelect =
    document.getElementById(
      "colorSelect"
    );


  colorSelect.innerHTML =
    "<option value=''>" +
    (
      type
        ? "Choose a color..."
        : "Select filament type first"
    ) +
    "</option>";


  if (!type) {
    return;
  }


  const colors = [];


  (shopData.inventory || [])
    .forEach(function(item) {

      const available =
        String(item.inStock)
          .toLowerCase() !==
        "false";


      if (

        available &&

        String(item.type).trim() ===
        String(type).trim() &&

        item.color &&

        !colors.includes(
          item.color
        )

      ) {

        colors.push(
          item.color
        );

      }

    });


  colors.forEach(function(color) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      color;


    option.textContent =
      color;


    colorSelect.appendChild(
      option
    );

  });

}


/* =========================================================
   ORDER TYPE
========================================================= */

function updateOrderType() {

  const selected =
    document.querySelector(
      "input[name='orderType']:checked"
    );


  if (!selected) {
    return;
  }


  const type =
    selected.value;


  const galleryChoice =
    document.getElementById(
      "galleryChoice"
    );


  const fileChoice =
    document.getElementById(
      "fileChoice"
    );


  const ideaChoice =
    document.getElementById(
      "ideaChoice"
    );


  const linkChoice =
    document.getElementById(
      "linkChoice"
    );


  const printSelect =
    document.getElementById(
      "printSelect"
    );


  const file =
    document.getElementById(
      "file"
    );


  const idea =
    document.getElementById(
      "idea"
    );


  const modelLink =
    document.getElementById(
      "modelLink"
    );


  /* Hide everything */

  galleryChoice.classList.add(
    "hidden"
  );

  fileChoice.classList.add(
    "hidden"
  );

  ideaChoice.classList.add(
    "hidden"
  );

  linkChoice.classList.add(
    "hidden"
  );


  printSelect.required =
    false;

  file.required =
    false;

  idea.required =
    false;

  modelLink.required =
    false;


  /* Gallery */

  if (
    type === "gallery"
  ) {

    galleryChoice.classList.remove(
      "hidden"
    );

    printSelect.required =
      true;

  }


  /* File */

  else if (
    type === "file"
  ) {

    fileChoice.classList.remove(
      "hidden"
    );

    file.required =
      true;

  }


  /* Idea */

  else if (
    type === "idea"
  ) {

    ideaChoice.classList.remove(
      "hidden"
    );

    idea.required =
      true;

  }


  /* Link */

  else if (
    type === "link"
  ) {

    linkChoice.classList.remove(
      "hidden"
    );

    modelLink.required =
      true;

  }

}


/* =========================================================
   FILE → BASE64
========================================================= */

function fileToBase64(file) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          const result =
            reader.result;


          resolve(
            result.split(",")[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   ORDER TYPE LISTENERS
========================================================= */

document
  .querySelectorAll(
    "input[name='orderType']"
  )
  .forEach(function(radio) {

    radio.addEventListener(
      "change",
      updateOrderType
    );

  });


/* =========================================================
   FILAMENT LISTENER
========================================================= */

document
  .getElementById(
    "typeSelect"
  )
  .addEventListener(
    "change",
    loadColors
  );


/* =========================================================
   SUBMIT ORDER
========================================================= */

document
  .getElementById(
    "orderForm"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const result =
        document.getElementById(
          "orderResult"
        );


      result.className = "";

      result.textContent =
        "Submitting order...";


      try {

        const formData =
          new FormData(this);


        const orderType =
          formData.get(
            "orderType"
          );


        let file = null;


        /* -------------------------------------------------
           FILE
        ------------------------------------------------- */

        if (
          orderType === "file"
        ) {

          const fileInput =
            document.getElementById(
              "file"
            );


          if (
            !fileInput.files ||
            fileInput.files.length === 0
          ) {

            throw new Error(
              "Please choose a 3D model file."
            );

          }


          const selectedFile =
            fileInput.files[0];


          if (
            selectedFile.size >
            15 * 1024 * 1024
          ) {

            throw new Error(
              "Your file must be smaller than 15 MB."
            );

          }


          const base64 =
            await fileToBase64(
              selectedFile
            );


          file = {

            name:
              selectedFile.name,

            type:
              selectedFile.type ||
              "application/octet-stream",

            base64:
              base64

          };

        }


        /* -------------------------------------------------
           BUILD ORDER
        ------------------------------------------------- */

        const order = {

          name:
            formData.get(
              "name"
            ),

          contact:
            formData.get(
              "contact"
            ),

          orderType:
            orderType,

          printId:
            orderType === "gallery"
              ? formData.get("printId")
              : "",

          quantity:
            Number(
              formData.get(
                "quantity"
              )
            ),

          filamentType:
            formData.get(
              "filamentType"
            ),

          color:
            formData.get(
              "color"
            ),

          idea:
            orderType === "idea"
              ? formData.get("idea")
              : "",

          modelLink:
            orderType === "link"
              ? formData.get("modelLink")
              : "",

          notes:
            formData.get(
              "notes"
            ),

          file:
            file

        };


        /* -------------------------------------------------
           SEND
        ------------------------------------------------- */

        const response =
          await api(
            "createOrder",
            order
          );


        if (
          !response ||
          response.ok === false
        ) {

          throw new Error(
            response &&
            response.error
              ? response.error
              : "Order could not be submitted."
          );

        }


        /* -------------------------------------------------
           SUCCESS
        ------------------------------------------------- */

        result.className =
          "success-message";


        result.innerHTML =
          "<strong>Order submitted!</strong>" +

          "<br><br>" +

          "Your order number is " +

          "<strong>" +

          escapeHTML(
            response.orderNumber
          ) +

          "</strong>" +

          "<br><br>" +

          "Save this number to track your order.";


        this.reset();


        document.querySelector(
          "input[name='orderType'][value='gallery']"
        ).checked = true;


        updateOrderType();


        loadShop();


      } catch (error) {

        result.className =
          "error-message";


        result.textContent =
          error.message;


        console.error(
          "ORDER ERROR:",
          error
        );

      }

    }
  );


/* =========================================================
   TRACK ORDER
========================================================= */

document
  .getElementById(
    "trackForm"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const result =
        document.getElementById(
          "trackResult"
        );


      result.innerHTML =
        "<p>Looking up order...</p>";


      try {

        const formData =
          new FormData(this);


        const response =
          await api(
            "track",
            {

              orderNumber:
                formData.get(
                  "orderNumber"
                )

            }
          );


        if (
          response.ok === false
        ) {

          throw new Error(
            response.error ||
            "Order not found."
          );

        }


        const order =
          response.order;


        result.innerHTML =

          "<div class='tracking-card'>" +

            "<div class='tracking-number'>" +

              "<span>Order</span>" +

              "<strong>" +

              escapeHTML(
                order.orderNumber
              ) +

              "</strong>" +

            "</div>" +


            "<div class='tracking-status'>" +

              "<span>Status</span>" +

              "<strong>" +

              escapeHTML(
                order.status ||
                "New"
              ) +

              "</strong>" +

            "</div>" +


            "<div class='tracking-row'>" +

              "<span>Print</span>" +

              "<strong>" +

              escapeHTML(
                order.printName ||
                "Customer model"
              ) +

              "</strong>" +

            "</div>" +


            "<div class='tracking-row'>" +

              "<span>Quantity</span>" +

              "<strong>" +

              escapeHTML(
                order.quantity
              ) +

              "</strong>" +

            "</div>" +


            "<div class='tracking-row'>" +

              "<span>Filament</span>" +

              "<strong>" +

              escapeHTML(
                order.filamentType ||
                ""
              ) +

              " / " +

              escapeHTML(
                order.color ||
                ""
              ) +

              "</strong>" +

            "</div>" +


            "<div class='tracking-row'>" +

              "<span>Estimated completion</span>" +

              "<strong>" +

              (
                order.eta
                  ? escapeHTML(
                      order.eta
                    )
                  : "Not set yet"
              ) +

              "</strong>" +

            "</div>" +

          "</div>";


      } catch (error) {

        result.innerHTML =
          "<div class='error-box'>" +

          escapeHTML(
            error.message
          ) +

          "</div>";

      }

    }
  );


/* =========================================================
