
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Printing Shop</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:30px 20px;
  text-align:center;
}

header h1{margin:0 0 8px}
header p{margin:0;color:#ccc}

main{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}

section{
  background:white;
  border-radius:14px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{margin-top:0}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}

.print-card{
  border:1px solid #ddd;
  border-radius:12px;
  overflow:hidden;
  background:white;
}

.print-card img{
  width: 100%;
  height: 210px;
  object-fit: contain;
  display: block;
  background: #f5f5f5;
}
.no-image{
  height:210px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ddd;
  color:#777;
  font-weight:bold;
}

.print-info{padding:15px}
.print-info h3{margin-top:0}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.button{
  border:none;
  border-radius:8px;
  padding:12px 18px;
  background:#111;
  color:white;
  cursor:pointer;
  font-size:15px;
  margin-top:15px;
}

.button:hover{opacity:.85}

.order-type-box{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin-top:10px;
}

.order-type-box label{
  margin:0;
  font-weight:normal;
  cursor:pointer;
}

.order-type-box input{
  width:auto;
  margin-right:5px;
}

.choice-box{
  margin-top:15px;
  padding:15px;
  background:#f7f7f7;
  border-radius:10px;
}

.hidden{display:none!important}

.success-message,
.error-message,
.error-box{
  padding:15px;
  border-radius:8px;
  margin-top:15px;
}

.success-message{
  background:#e8f7e8;
  border:1px solid #8ac98a;
}

.error-message,
.error-box{
  background:#ffecec;
  border:1px solid #e08a8a;
}

.tracking-card{
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
  margin-top:20px;
}

.tracking-number,
.tracking-status,
.tracking-row{
  padding:15px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-bottom:1px solid #eee;
}

.tracking-row:last-child{border-bottom:none}

.tracking-number span,
.tracking-status span,
.tracking-row span{
  color:#777;
}

@media(max-width:600px){
  main{padding:15px}
  section{padding:18px}

  .tracking-number,
  .tracking-status,
  .tracking-row{
    flex-direction:column;
    gap:5px;
  }
}
</style>
</head>

<body>

<header>
  <h1>3D Printing Shop</h1>
  <p>Choose a print or submit your own model.</p>
</header>

<main>

<section>
  <h2>Gallery</h2>

  <div id="galleryGrid" class="gallery">
    <p>Loading prints...</p>
  </div>
</section>


<section id="order">

<h2>Place an Order</h2>

<form id="orderForm">

<label for="name">Your Name</label>
<input id="name" name="name" type="text" required>


<label for="contact">Email or Phone</label>
<input id="contact" name="contact" type="text" required>


<label>What would you like printed?</label>

<div class="order-type-box">

<label>
<input type="radio" name="orderType" value="gallery" checked>
Gallery Print
</label>

<label>
<input type="radio" name="orderType" value="file">
Upload a File
</label>

<label>
<input type="radio" name="orderType" value="idea">
I Have an Idea
</label>

<label>
<input type="radio" name="orderType" value="link">
Model Link
</label>

</div>


<div id="galleryChoice" class="choice-box">

<label for="printSelect">Choose a print</label>

<select id="printSelect" name="printId">
<option value="">Loading prints...</option>
</select>

</div>


<div id="fileChoice" class="choice-box hidden">

<label for="file">Upload your 3D model</label>

<input
  id="file"
  name="file"
  type="file"
  accept=".stl,.3mf,.obj,.step,.stp"
>

<p>Maximum file size: 15 MB.</p>

</div>


<div id="ideaChoice" class="choice-box hidden">

<label for="idea">Describe your idea</label>

<textarea
  id="idea"
  name="idea"
  placeholder="Tell us what you want printed..."
></textarea>

</div>


<div id="linkChoice" class="choice-box hidden">

<label for="modelLink">Model link</label>

<input
  id="modelLink"
  name="modelLink"
  type="url"
  placeholder="https://..."
>

<p>Paste a link to the 3D model you want printed.</p>

</div>


<label for="quantity">Quantity</label>

<input
  id="quantity"
  name="quantity"
  type="number"
  min="1"
  value="1"
  required
>


<label for="typeSelect">Filament Type</label>

<select
  id="typeSelect"
  name="filamentType"
  required
>
<option value="">Loading filament types...</option>
</select>


<label for="colorSelect">Filament Color</label>

<select
  id="colorSelect"
  name="color"
  required
>
<option value="">Select filament type first</option>
</select>


<label for="notes">Notes</label>

<textarea
  id="notes"
  name="notes"
  placeholder="Anything else we should know?"
></textarea>


<button class="button" type="submit">
Submit Order
</button>

<div id="orderResult"></div>

</form>
</section>


<section>

<h2>Track Your Order</h2>

<form id="trackForm">

<label for="orderNumber">Order Number</label>

<input
  id="orderNumber"
  name="orderNumber"
  type="text"
  placeholder="FF-1001"
  required
>

<button class="button" type="submit">
Track Order
</button>

</form>

<div id="trackResult"></div>

</section>

</main>


<script>

/* =========================================================
   CLOUDFLARE WORKER
========================================================= */

const API_URL =
"https://3d-print-shop-api.spuddyboy5.workers.dev";


/* =========================================================
   DATA
========================================================= */

let shopData = {
  gallery: [],
  inventory: []
};


/* =========================================================
   API
========================================================= */

async function api(action, data = {}) {

  const url =
    API_URL +
    "?action=" +
    encodeURIComponent(action) +
    "&data=" +
    encodeURIComponent(JSON.stringify(data));


  let response;

  try {

    response = await fetch(url, {
      method:"GET",
      mode:"cors",
      cache:"no-store"
    });

  } catch(error) {

    console.error("API CONNECTION ERROR:",error);

    throw new Error(
      "Could not connect to the shop server. Make sure the Cloudflare Worker is deployed and its URL is correct."
    );

  }


  if(!response.ok){

    throw new Error(
      "Shop server returned HTTP " +
      response.status
    );

  }


  let result;

  try{

    result = await response.json();

  }catch(error){

    throw new Error(
      "The shop server did not return valid JSON."
    );

  }


  return result;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   LOAD SHOP
========================================================= */

async function loadShop(){

  const gallery =
    document.getElementById("galleryGrid");


  gallery.innerHTML =
    "<p>Loading prints...</p>";


  try{

    const response =
      await api("catalog");


    if(!response || response.ok === false){

      throw new Error(
        response?.error ||
        "Could not load shop."
      );

    }


    shopData = {

      gallery:
        Array.isArray(response.gallery)
          ? response.gallery
          : [],

      inventory:
        Array.isArray(response.inventory)
          ? response.inventory
          : []

    };


    loadGallery();
    loadPrints();
    loadFilamentTypes();


  }catch(error){

    gallery.innerHTML =
      "<div class='error-box'>" +
      "<h3>Shop unavailable</h3>" +
      "<p>" +
      escapeHTML(error.message) +
      "</p>" +
      "</div>";


    console.error("LOAD ERROR:",error);

  }

}


/* =========================================================
   GALLERY
========================================================= */

function loadGallery(){

  const gallery =
    document.getElementById("galleryGrid");


  const prints =
    shopData.gallery || [];


  if(!prints.length){

    gallery.innerHTML =
      "<div>" +
      "<h3>No prints yet</h3>" +
      "<p>Add a print to the Gallery sheet.</p>" +
      "</div>";

    return;

  }


  gallery.innerHTML =
    prints.map(function(print){

      const imageHTML =
        print.imageUrl

        ?

        "<img src='" +
        escapeHTML(print.imageUrl) +
        "' alt='" +
        escapeHTML(print.name) +
        "'>"

        :

        "<div class='no-image'>3D PRINT</div>";


      return (

        "<article class='print-card'>" +

        imageHTML +

        "<div class='print-info'>" +

        "<h3>" +
        escapeHTML(print.name) +
        "</h3>" +

        "<p>" +
        escapeHTML(print.description || "") +
        "</p>" +

        "<button " +
        "type='button' " +
        "class='button order-print' " +
        "data-id='" +
        escapeHTML(print.id) +
        "'>" +
        "Order this" +
        "</button>" +

        "</div>" +

        "</article>"

      );

    }).join("");


  document
    .querySelectorAll(".order-print")
    .forEach(function(button){

      button.addEventListener("click",function(){

        document.querySelector(
          "input[name='orderType'][value='gallery']"
        ).checked = true;


        updateOrderType();


        document.getElementById(
          "printSelect"
        ).value = button.dataset.id;


        document.getElementById("order")
          .scrollIntoView({
            behavior:"smooth"
          });

      });

    });

}


/* =========================================================
   PRINT SELECT
========================================================= */

function loadPrints(){

  const select =
    document.getElementById("printSelect");


  select.innerHTML =
    "<option value=''>" +
    "Choose a print..." +
    "</option>";


  (shopData.gallery || [])
    .forEach(function(print){

      const option =
        document.createElement("option");


      option.value =
        String(print.id);


      option.textContent =
        print.name;


      select.appendChild(option);

    });

}


/* =========================================================
   FILAMENT TYPES
========================================================= */

function loadFilamentTypes(){

  const select =
    document.getElementById("typeSelect");


  const types = [];


  (shopData.inventory || [])
    .forEach(function(item){

      const available =
        String(item.inStock)
          .toLowerCase() !== "false";


      if(
        available &&
        item.type &&
        !types.includes(String(item.type))
      ){

        types.push(String(item.type));

      }

    });


  select.innerHTML =
    "<option value=''>" +
    "Choose a type..." +
    "</option>";


  types.forEach(function(type){

    const option =
      document.createElement("option");


    option.value = type;
    option.textContent = type;


    select.appendChild(option);

  });


  loadColors();

}


/* =========================================================
   COLORS
========================================================= */

function loadColors(){

  const type =
    document.getElementById("typeSelect").value;


  const colorSelect =
    document.getElementById("colorSelect");


  colorSelect.innerHTML =
    "<option value=''>" +
    (
      type
        ? "Choose a color..."
        : "Select filament type first"
    ) +
    "</option>";


  if(!type)return;


  const colors = [];


  (shopData.inventory || [])
    .forEach(function(item){

      const available =
        String(item.inStock)
          .toLowerCase() !== "false";


      if(
        available &&
        String(item.type).trim() ===
        String(type).trim() &&
        item.color &&
        !colors.includes(String(item.color))
      ){

        colors.push(String(item.color));

      }

    });


  colors.forEach(function(color){

    const option =
      document.createElement("option");


    option.value = color;
    option.textContent = color;


    colorSelect.appendChild(option);

  });

}


/* =========================================================
   ORDER TYPE
========================================================= */

function updateOrderType(){

  const selected =
    document.querySelector(
      "input[name='orderType']:checked"
    );


  if(!selected)return;


  const type = selected.value;


  const galleryChoice =
    document.getElementById("galleryChoice");

  const fileChoice =
    document.getElementById("fileChoice");

  const ideaChoice =
    document.getElementById("ideaChoice");

  const linkChoice =
    document.getElementById("linkChoice");


  const printSelect =
    document.getElementById("printSelect");

  const file =
    document.getElementById("file");

  const idea =
    document.getElementById("idea");

  const modelLink =
    document.getElementById("modelLink");


  galleryChoice.classList.add("hidden");
  fileChoice.classList.add("hidden");
  ideaChoice.classList.add("hidden");
  linkChoice.classList.add("hidden");


  printSelect.required = false;
  file.required = false;
  idea.required = false;
  modelLink.required = false;


  if(type === "gallery"){

    galleryChoice.classList.remove("hidden");
    printSelect.required = true;

  }


  if(type === "file"){

    fileChoice.classList.remove("hidden");
    file.required = true;

  }


  if(type === "idea"){

    ideaChoice.classList.remove("hidden");
    idea.required = true;

  }


  if(type === "link"){

    linkChoice.classList.remove("hidden");
    modelLink.required = true;

  }

}


/* =========================================================
   FILE → BASE64
========================================================= */

function fileToBase64(file){

  return new Promise(function(resolve,reject){

    const reader =
      new FileReader();


    reader.onload = function(){

      const result =
        String(reader.result || "");


      const comma =
        result.indexOf(",");


      if(comma === -1){

        reject(
          new Error("Could not read the selected file.")
        );

        return;

      }


      resolve(
        result.substring(comma + 1)
      );

    };


    reader.onerror = function(){

      reject(
        new Error("Could not read the selected file.")
      );

    };


    reader.readAsDataURL(file);

  });

}


/* =========================================================
   LISTENERS
========================================================= */

document
  .querySelectorAll(
    "input[name='orderType']"
  )
  .forEach(function(radio){

    radio.addEventListener(
      "change",
      updateOrderType
    );

  });


document
  .getElementById("typeSelect")
  .addEventListener(
    "change",
    loadColors
  );


/* =========================================================
   SUBMIT ORDER
========================================================= */

document
  .getElementById("orderForm")
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      const result =
        document.getElementById("orderResult");


      result.className = "";
      result.textContent =
        "Submitting order...";


      try{

        const formData =
          new FormData(this);


        const orderType =
          formData.get("orderType");


        let file = null;


        /* FILE */

        if(orderType === "file"){

          const fileInput =
            document.getElementById("file");


          if(
            !fileInput.files ||
            !fileInput.files.length
          ){

            throw new Error(
              "Please choose a 3D model file."
            );

          }


          const selectedFile =
            fileInput.files[0];


          if(
            selectedFile.size >
            15 * 1024 * 1024
          ){

            throw new Error(
              "Your file must be smaller than 15 MB."
            );

          }


          result.textContent =
            "Reading file...";


          const base64 =
            await fileToBase64(selectedFile);


          file = {

            name:selectedFile.name,

            type:
              selectedFile.type ||
              "application/octet-stream",

            base64:base64

          };

        }


        /* BUILD ORDER */

        const order = {

          name:
            String(formData.get("name") || ""),

          contact:
            String(formData.get("contact") || ""),

          orderType:
            String(orderType || ""),

          printId:
            orderType === "gallery"
              ? String(formData.get("printId") || "")
              : "",

          quantity:
            Number(formData.get("quantity") || 1),

          filamentType:
            String(formData.get("filamentType") || ""),

          color:
            String(formData.get("color") || ""),

          idea:
            orderType === "idea"
              ? String(formData.get("idea") || "")
              : "",

          modelLink:
            orderType === "link"
              ? String(formData.get("modelLink") || "")
              : "",

          notes:
            String(formData.get("notes") || ""),

          file:file

        };


        /* SEND */

        result.textContent =
          "Submitting order...";


        const response =
          await api(
            "createOrder",
            order
          );


        if(
          !response ||
          response.ok === false
        ){

          throw new Error(
            response?.error ||
            "Order could not be submitted."
          );

        }


        /* SUCCESS */

        result.className =
          "success-message";


        result.innerHTML =
          "<strong>Order submitted!</strong>" +
          "<br><br>" +
          "Your order number is " +
          "<strong>" +
          escapeHTML(response.orderNumber) +
          "</strong>" +
          "<br><br>" +
          "Save this number to track your order.";


        this.reset();


        document.querySelector(
          "input[name='orderType'][value='gallery']"
        ).checked = true;


        updateOrderType();


        loadShop();


      }catch(error){

        result.className =
          "error-message";


        result.textContent =
          error.message;


        console.error(
          "ORDER ERROR:",
          error
        );

      }

    }
  );


/* =========================================================
   TRACK ORDER
========================================================= */

document
  .getElementById("trackForm")
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      const result =
        document.getElementById("trackResult");


      result.innerHTML =
        "<p>Looking up order...</p>";


      try{

        const formData =
          new FormData(this);


        const response =
          await api(
            "track",
            {
              orderNumber:
                formData.get("orderNumber")
            }
          );


        if(
          !response ||
          response.ok === false
        ){

          throw new Error(
            response?.error ||
            "Order not found."
          );

        }


        const order =
          response.order;


        result.innerHTML =

          "<div class='tracking-card'>" +

          "<div class='tracking-number'>" +
          "<span>Order</span>" +
          "<strong>" +
          escapeHTML(order.orderNumber) +
          "</strong>" +
          "</div>" +

          "<div class='tracking-status'>" +
          "<span>Status</span>" +
          "<strong>" +
          escapeHTML(order.status || "New") +
          "</strong>" +
          "</div>" +

          "<div class='tracking-row'>" +
          "<span>Print</span>" +
          "<strong>" +
          escapeHTML(
            order.printName ||
            "Customer model"
          ) +
          "</strong>" +
          "</div>" +

          "<div class='tracking-row'>" +
          "<span>Quantity</span>" +
          "<strong>" +
          escapeHTML(order.quantity) +
          "</strong>" +
          "</div>" +

          "<div class='tracking-row'>" +
          "<span>Filament</span>" +
          "<strong>" +
          escapeHTML(order.filamentType || "") +
          " / " +
          escapeHTML(order.color || "") +
          "</strong>" +
          "</div>" +

          "<div class='tracking-row'>" +
          "<span>Estimated completion</span>" +
          "<strong>" +
          (
            order.eta
              ? escapeHTML(order.eta)
              : "Not set yet"
          ) +
          "</strong>" +
          "</div>" +

          "</div>";


      }catch(error){

        result.innerHTML =
          "<div class='error-box'>" +
          escapeHTML(error.message) +
          "</div>";

      }

    }
  );


/* =========================================================
   START
========================================================= */

updateOrderType();

loadShop();

</script>

</body>
</html>
