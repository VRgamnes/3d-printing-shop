<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Printing Shop</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 30px 20px;
  text-align: center;
}

header h1 {
  margin: 0 0 8px;
}

header p {
  margin: 0;
  color: #ccc;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px;
}

section {
  background: white;
  border-radius: 14px;
  padding: 25px;
  margin-bottom: 25px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;
}

.print-card {
  border: 1px solid #ddd;
  border-radius: 12px;
  overflow: hidden;
  background: white;
}

.print-card img {
  width: 100%;
  height: 210px;
  object-fit: cover;
  display: block;
}

.no-image {
  height: 210px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ddd;
  color: #777;
  font-weight: bold;
}

.print-info {
  padding: 15px;
}

.print-info h3 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 6px;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.button {
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  background: #111;
  color: white;
  cursor: pointer;
  font-size: 15px;
  margin-top: 15px;
}

.button:hover {
  opacity: .85;
}

.button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.order-type-box {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.order-type-box label {
  margin: 0;
  font-weight: normal;
  cursor: pointer;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.order-type-box input {
  width: auto;
  margin-right: 5px;
}

.choice-box {
  margin-top: 15px;
  padding: 15px;
  background: #f7f7f7;
  border-radius: 10px;
}

.hidden {
  display: none !important;
}

.success-message,
.error-message,
.error-box {
  padding: 15px;
  border-radius: 8px;
  margin-top: 15px;
}

.success-message {
  background: #e8f7e8;
  border: 1px solid #8ac98a;
}

.error-message,
.error-box {
  background: #ffecec;
  border: 1px solid #e08a8a;
}

.tracking-card {
  border: 1px solid #ddd;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 15px;
}

.tracking-number,
.tracking-status,
.tracking-row {
  padding: 15px;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid #eee;
}

.tracking-row:last-child {
  border-bottom: none;
}

.tracking-number span,
.tracking-status span,
.tracking-row span {
  color: #777;
}

.small-text {
  color: #777;
  font-size: 14px;
}

.loading {
  color: #777;
}

@media (max-width: 600px) {
  main {
    padding: 15px;
  }

  section {
    padding: 18px;
  }

  .tracking-number,
  .tracking-status,
  .tracking-row {
    flex-direction: column;
    gap: 5px;
  }
}
</style>

</head>

<body>

<header>
  <h1>3D Printing Shop</h1>
  <p>Choose a print or submit your own model.</p>
</header>

<main>

<!-- =====================================================
     GALLERY
====================================================== -->

<section>

  <h2>Gallery</h2>

  <div id="galleryGrid" class="gallery">
    <p class="loading">Loading prints...</p>
  </div>

</section>

<!-- =====================================================
     ORDER FORM
====================================================== -->

<section id="order">

  <h2>Place an Order</h2>

  <form id="orderForm">


<label for="name">
  Your Name
</label>

<input
  id="name"
  name="name"
  type="text"
  required
>


<label for="contact">
  Email or Phone
</label>

<input
  id="contact"
  name="contact"
  type="text"
  required
>


<label>
  What would you like printed?
</label>

<div class="order-type-box">

  <label>
    <input
      type="radio"
      name="orderType"
      value="gallery"
      checked
    >
    Gallery Print
  </label>

  <label>
    <input
      type="radio"
      name="orderType"
      value="file"
    >
    Upload a File
  </label>

  <label>
    <input
      type="radio"
      name="orderType"
      value="idea"
    >
    I Have an Idea
  </label>

  <label>
    <input
      type="radio"
      name="orderType"
      value="link"
    >
    Model Link
  </label>

</div>


<!-- =================================================
     GALLERY OPTION
================================================== -->

<div
  id="galleryChoice"
  class="choice-box"
>

  <label for="printSelect">
    Choose a print
  </label>

  <select
    id="printSelect"
    name="printId"
  >
    <option value="">
      Loading prints...
    </option>
  </select>

</div>


<!-- =================================================
     FILE OPTION
================================================== -->

<div
  id="fileChoice"
  class="choice-box hidden"
>

  <label for="file">
    Upload your 3D model
  </label>

  <input
    id="file"
    name="file"
    type="file"
    accept=".stl,.3mf,.obj,.step,.stp"
  >

  <p class="small-text">
    Accepted: STL, 3MF, OBJ, STEP, STP
    <br>
    Maximum file size: 15 MB.
  </p>

</div>


<!-- =================================================
     IDEA OPTION
================================================== -->

<div
  id="ideaChoice"
  class="choice-box hidden"
>

  <label for="idea">
    Describe your idea
  </label>

  <textarea
    id="idea"
    name="idea"
    placeholder="Tell us what you want printed. Include as much detail as possible."
  ></textarea>

</div>


<!-- =================================================
     LINK OPTION
================================================== -->

<div
  id="linkChoice"
  class="choice-box hidden"
>

  <label for="modelLink">
    Model Link
  </label>

  <input
    id="modelLink"
    name="modelLink"
    type="url"
    placeholder="https://..."
  >

  <p class="small-text">
    Paste a link to the 3D model you want printed.
  </p>

</div>


<!-- =================================================
     QUANTITY
================================================== -->

<label for="quantity">
  Quantity
</label>

<input
  id="quantity"
  name="quantity"
  type="number"
  min="1"
  value="1"
  required
>


<!-- =================================================
     FILAMENT TYPE
================================================== -->

<label for="typeSelect">
  Filament Type
</label>

<select
  id="typeSelect"
  name="filamentType"
  required
>

  <option value="">
    Loading filament types...
  </option>

</select>


<!-- =================================================
     COLOR
================================================== -->

<label for="colorSelect">
  Filament Color
</label>

<select
  id="colorSelect"
  name="color"
  required
>

  <option value="">
    Select filament type first
  </option>

</select>


<!-- =================================================
     NOTES
================================================== -->

<label for="notes">
  Notes
</label>

<textarea
  id="notes"
  name="notes"
  placeholder="Anything else we should know?"
></textarea>


<button
  id="submitButton"
  class="button"
  type="submit"
>
  Submit Order
</button>


<div id="orderResult"></div>


  </form>

</section>

<!-- =====================================================
     TRACK ORDER
====================================================== -->

<section>

  <h2>Track Your Order</h2>

  <form id="trackForm">


<label for="orderNumber">
  Order Number
</label>

<input
  id="orderNumber"
  name="orderNumber"
  type="text"
  placeholder="FF-1001"
  required
>

<button
  class="button"
  type="submit"
>
  Track Order
</button>


  </form>

  <div id="trackResult"></div>

</section>

</main>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT URL
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwXBlRSPgE_ufvIPhw9LqTdX95CW3YYjQcLajL4XcKAv6GbAKVErdYDiSrD0AXAK09_/exec";


/* =========================================================
   DATA
========================================================= */

let shopData = {
  gallery: [],
  inventory: []
};


/* =========================================================
   API
========================================================= */

async function api(action, data = {}) {

  const url =
    API_URL +
    "?action=" +
    encodeURIComponent(action) +
    "&data=" +
    encodeURIComponent(
      JSON.stringify(data)
    );

  const response =
    await fetch(url, {
      method: "GET"
    });

  if (!response.ok) {
    throw new Error(
      "Could not connect to the shop server."
    );
  }

  const text =
    await response.text();

  let result;

  try {
    result = JSON.parse(text);
  } catch (error) {
    throw new Error(
      "The shop server returned an invalid response."
    );
  }

  return result;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   LOAD SHOP
========================================================= */

async function loadShop() {

  const gallery =
    document.getElementById(
      "galleryGrid"
    );

  try {

    const response =
      await api("catalog");

    if (
      !response ||
      response.ok === false
    ) {

      throw new Error(
        response?.error ||
        "Could not load shop."
      );

    }

    shopData = {
      gallery:
        Array.isArray(response.gallery)
          ? response.gallery
          : [],

      inventory:
        Array.isArray(response.inventory)
          ? response.inventory
          : []
    };

    loadGallery();
    loadPrints();
    loadFilamentTypes();

  } catch (error) {

    gallery.innerHTML =
      "<div class='error-box'>" +
        "<h3>Shop unavailable</h3>" +
        "<p>" +
          escapeHTML(error.message) +
        "</p>" +
      "</div>";

    console.error(
      "SHOP LOAD ERROR:",
      error
    );

  }

}


/* =========================================================
   LOAD GALLERY
========================================================= */

function loadGallery() {

  const gallery =
    document.getElementById(
      "galleryGrid"
    );

  const prints =
    shopData.gallery || [];


  if (
    prints.length === 0
  ) {

    gallery.innerHTML =
      "<div>" +
        "<h3>No prints yet</h3>" +
        "<p>Add a print to the Gallery sheet.</p>" +
      "</div>";

    return;
  }


  gallery.innerHTML =
    prints.map(function(print) {

      let imageHTML =
        "<div class='no-image'>3D PRINT</div>";

      if (print.imageUrl) {

        imageHTML =
          "<img src='" +
            escapeHTML(print.imageUrl) +
            "' alt='" +
            escapeHTML(print.name) +
          "'>";

      }


      return (

        "<article class='print-card'>" +

          imageHTML +

          "<div class='print-info'>" +

            "<h3>" +
              escapeHTML(print.name) +
            "</h3>" +

            "<p>" +
              escapeHTML(
                print.description || ""
              ) +
            "</p>" +

            "<button " +
              "type='button' " +
              "class='button order-print' " +
              "data-id='" +
                escapeHTML(print.id) +
              "'" +
            ">" +
              "Order this" +
            "</button>" +

          "</div>" +

        "</article>"

      );

    }).join("");


  document
    .querySelectorAll(".order-print")
    .forEach(function(button) {

      button.addEventListener(
        "click",
        function() {

          const galleryRadio =
            document.querySelector(
              "input[name='orderType'][value='gallery']"
            );

          galleryRadio.checked =
            true;

          updateOrderType();


          const printSelect =
            document.getElementById(
              "printSelect"
            );

          printSelect.value =
            button.dataset.id;


          document
            .getElementById("order")
            .scrollIntoView({
              behavior: "smooth"
            });

        }
      );

    });

}


/* =========================================================
   LOAD PRINT SELECT
========================================================= */

function loadPrints() {

  const select =
    document.getElementById(
      "printSelect"
    );


  select.innerHTML =
    "<option value=''>" +
      "Choose a print..." +
    "</option>";


  (shopData.gallery || [])
    .forEach(function(print) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(print.id);

      option.textContent =
        print.name;

      select.appendChild(
        option
      );

    });

}


/* =========================================================
   LOAD FILAMENT TYPES
========================================================= */

function loadFilamentTypes() {

  const select =
    document.getElementById(
      "typeSelect"
    );


  const types = [];


  (shopData.inventory || [])
    .forEach(function(item) {

      const available =
        String(item.inStock)
          .trim()
          .toLowerCase() !==
        "false";


      const type =
        String(item.type || "")
          .trim();


      if (
        available &&
        type &&
        !types.includes(type)
      ) {

        types.push(type);

      }

    });


  select.innerHTML =
    "<option value=''>" +
      "Choose a type..." +
    "</option>";


  types.forEach(function(type) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      type;

    option.textContent =
      type;

    select.appendChild(
      option
    );

  });


  loadColors();

}


/* =========================================================
   LOAD COLORS
========================================================= */

function loadColors() {

  const typeSelect =
    document.getElementById(
      "typeSelect"
    );

  const colorSelect =
    document.getElementById(
      "colorSelect"
    );


  const type =
    String(
      typeSelect.value || ""
    ).trim();


  colorSelect.innerHTML =
    "<option value=''>" +
      (
        type
          ? "Choose a color..."
          : "Select filament type first"
      ) +
    "</option>";


  if (!type) {
    return;
  }


  const colors = [];


  (shopData.inventory || [])
    .forEach(function(item) {

      const available =
        String(item.inStock)
          .trim()
          .toLowerCase() !==
        "false";


      const itemType =
        String(item.type || "")
          .trim();


      const color =
        String(item.color || "")
          .trim();


      if (
        available &&
        itemType === type &&
        color &&
        !colors.includes(color)
      ) {

        colors.push(color);

      }

    });


  colors.forEach(function(color) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      color;

    option.textContent =
      color;

    colorSelect.appendChild(
      option
    );

  });

}


/* =========================================================
   ORDER TYPE
========================================================= */

function updateOrderType() {

  const selected =
    document.querySelector(
      "input[name='orderType']:checked"
    );


  if (!selected) {
    return;
  }


  const type =
    selected.value;


  const galleryChoice =
    document.getElementById(
      "galleryChoice"
    );

  const fileChoice =
    document.getElementById(
      "fileChoice"
    );

  const ideaChoice =
    document.getElementById(
      "ideaChoice"
    );

  const linkChoice =
    document.getElementById(
      "linkChoice"
    );


  const printSelect =
    document.getElementById(
      "printSelect"
    );

  const file =
    document.getElementById(
      "file"
    );

  const idea =
    document.getElementById(
      "idea"
    );

  const modelLink =
    document.getElementById(
      "modelLink"
    );


  /* -----------------------------------------
     HIDE ALL
  ----------------------------------------- */

  galleryChoice.classList.add("hidden");
  fileChoice.classList.add("hidden");
  ideaChoice.classList.add("hidden");
  linkChoice.classList.add("hidden");


  /* -----------------------------------------
     REMOVE REQUIRED
  ----------------------------------------- */

  printSelect.required = false;
  file.required = false;
  idea.required = false;
  modelLink.required = false;


  /* -----------------------------------------
     GALLERY
  ----------------------------------------- */

  if (type === "gallery") {

    galleryChoice.classList.remove(
      "hidden"
    );

    printSelect.required = true;

  }


  /* -----------------------------------------
     FILE
  ----------------------------------------- */

  else if (type === "file") {

    fileChoice.classList.remove(
      "hidden"
    );

    file.required = true;

  }


  /* -----------------------------------------
     IDEA
  ----------------------------------------- */

  else if (type === "idea") {

    ideaChoice.classList.remove(
      "hidden"
    );

    idea.required = true;

  }


  /* -----------------------------------------
     LINK
  ----------------------------------------- */

  else if (type === "link") {

    linkChoice.classList.remove(
      "hidden"
    );

    modelLink.required = true;

  }

}


/* =========================================================
   FILE TO BASE64
========================================================= */

function fileToBase64(file) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          const result =
            reader.result;


          const comma =
            result.indexOf(",");


          if (comma === -1) {

            reject(
              new Error(
                "Could not read the file."
              )
            );

            return;
          }


          resolve(
            result.substring(
              comma + 1
            )
          );

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Could not read the file."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   ORDER TYPE LISTENERS
========================================================= */

document
  .querySelectorAll(
    "input[name='orderType']"
  )
  .forEach(function(radio) {

    radio.addEventListener(
      "change",
      updateOrderType
    );

  });


/* =========================================================
   FILAMENT LISTENER
========================================================= */

document
  .getElementById(
    "typeSelect"
  )
  .addEventListener(
    "change",
    function() {

      document
        .getElementById(
          "colorSelect"
        )
        .value = "";

      loadColors();

    }
  );


/* =========================================================
   SUBMIT ORDER
========================================================= */

document
  .getElementById(
    "orderForm"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const form =
        this;

      const result =
        document.getElementById(
          "orderResult"
        );

      const submitButton =
        document.getElementById(
          "submitButton"
        );


      result.className = "";

      result.textContent =
        "Submitting order...";


      submitButton.disabled =
        true;


      try {

        const formData =
          new FormData(form);


        const orderType =
          String(
            formData.get(
              "orderType"
            ) || ""
          );


        /* -----------------------------------------
           GET BASIC VALUES
        ----------------------------------------- */

        const name =
          String(
            formData.get("name") || ""
          ).trim();


        const contact =
          String(
            formData.get("contact") || ""
          ).trim();


        const filamentType =
          String(
            formData.get("filamentType") || ""
          ).trim();


        const color =
          String(
            formData.get("color") || ""
          ).trim();


        const quantity =
          Number(
            formData.get("quantity") || 1
          );


        if (!name) {
          throw new Error(
            "Please enter your name."
          );
        }


        if (!contact) {
          throw new Error(
            "Please enter your contact information."
          );
        }


        if (!filamentType) {
          throw new Error(
            "Please choose a filament type."
          );
        }


        if (!color) {
          throw new Error(
            "Please choose a filament color."
          );
        }


        if (
          !Number.isFinite(quantity) ||
          quantity < 1
        ) {

          throw new Error(
            "Please enter a valid quantity."
          );

        }


        /* -----------------------------------------
           GALLERY PRINT ID
           
           IMPORTANT:
           Only Gallery gets a printId.
           File / Idea / Link get "".
        ----------------------------------------- */

        let printId = "";


        if (
          orderType === "gallery"
        ) {

          printId =
            String(
              formData.get(
                "printId"
              ) || ""
            ).trim();


          if (!printId) {

            throw new Error(
              "Please choose a gallery print."
            );

          }

        }


        /* -----------------------------------------
           IDEA
        ----------------------------------------- */

        let idea = "";


        if (
          orderType === "idea"
        ) {

          idea =
            String(
              formData.get(
                "idea"
              ) || ""
            ).trim();


          if (!idea) {

            throw new Error(
              "Please describe your idea."
            );

          }

        }


        /* -----------------------------------------
           LINK
        ----------------------------------------- */

        let modelLink = "";


        if (
          orderType === "link"
        ) {

          modelLink =
            String(
              formData.get(
                "modelLink"
              ) || ""
            ).trim();


          if (!modelLink) {

            throw new Error(
              "Please enter the model link."
            );

          }

        }


        /* -----------------------------------------
           FILE
        ----------------------------------------- */

        let file = null;


        if (
          orderType === "file"
        ) {

          const fileInput =
            document.getElementById(
              "file"
            );


          if (
            !fileInput.files ||
            fileInput.files.length === 0
          ) {

            throw new Error(
              "Please choose a 3D model file."
            );

          }


          const selectedFile =
            fileInput.files[0];


          if (
            selectedFile.size >
            15 * 1024 * 1024
          ) {

            throw new Error(
              "Your file must be smaller than 15 MB."
            );

          }


          const base64 =
            await fileToBase64(
              selectedFile
            );


          file = {

            name:
              selectedFile.name,

            type:
              selectedFile.type ||
              "application/octet-stream",

            base64:
              base64

          };

        }


        /* -----------------------------------------
           BUILD ORDER
        ----------------------------------------- */

        const order = {

          name:
            name,

          contact:
            contact,

          orderType:
            orderType,

          /*
             THIS IS THE IMPORTANT FIX.

             Gallery:
               actual gallery ID

             File:
               empty

             Idea:
               empty

             Link:
               empty
          */

          printId:
            printId,

          quantity:
            quantity,

          filamentType:
            filamentType,

          color:
            color,

          idea:
            idea,

          modelLink:
            modelLink,

          notes:
            String(
              formData.get(
                "notes"
              ) || ""
            ).trim(),

          file:
            file

        };


        console.log(
          "ORDER BEING SENT:",
          order
        );


        /* -----------------------------------------
           SEND TO GOOGLE APPS SCRIPT
        ----------------------------------------- */

        const response =
          await api(
            "createOrder",
            order
          );


        console.log(
          "SERVER RESPONSE:",
          response
        );


        if (
          !response ||
          response.ok === false
        ) {

          throw new Error(
            response &&
            response.error
              ? response.error
              : "Order could not be submitted."
          );

        }


        /* -----------------------------------------
           SUCCESS
        ----------------------------------------- */

        result.className =
          "success-message";


        result.innerHTML =

          "<strong>Order submitted!</strong>" +

          "<br><br>" +

          "Your order number is " +

          "<strong>" +

          escapeHTML(
            response.orderNumber
          ) +

          "</strong>" +

          "<br><br>" +

          "Save this number to track your order.";


        form.reset();


        document
          .querySelector(
            "input[name='orderType'][value='gallery']"
          )
          .checked = true;


        updateOrderType();


        loadShop();


      } catch (error) {

        result.className =
          "error-message";


        result.textContent =
          error.message ||
          "Something went wrong.";


        console.error(
          "ORDER ERROR:",
          error
        );

      } finally {

        submitButton.disabled =
          false;

      }

    }
  );


/* =========================================================
   TRACK ORDER
========================================================= */

document
  .getElementById(
    "trackForm"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const result =
        document.getElementById(
          "trackResult"
        );


      result.innerHTML =
        "<p>Looking up order...</p>";


      try {

        const formData =
          new FormData(this);


        const orderNumber =
          String(
            formData.get(
              "orderNumber"
            ) || ""
          ).trim();


        if (!orderNumber) {

          throw new Error(
            "Please enter an order number."
          );

        }


        const response =
          await api(
            "track",
            {
              orderNumber:
                orderNumber
            }
          );


        if (
          !response ||
          response.ok === false
        ) {

          throw new Error(
            response?.error ||
            "Order not found."
          );

        }


        const order =
          response.order;


        result.innerHTML =

          "<div class='tracking-card'>" +

            "<div class='tracking-number'>" +

              "<span>Order</span>" +

              "<strong>" +

                escapeHTML(
                  order.orderNumber
                ) +

              "</strong>" +

            "</div>" +


            "<div class='tracking-status'>" +

              "<span>Status</span>" +

              "<strong>" +

                escapeHTML(
                  order.status ||
                  "New"
                ) +

              "</strong>" +

            "</div>" +


            "<div class='tracking-row'>" +

              "<span>Print</span>" +

              "<strong>" +

                escapeHTML(
                  order.printName ||
                  (
                    order.orderType === "idea"
                      ? "Customer idea"
                      : order.orderType === "link"
                        ? "Model link"
                        : "Customer model"
                  )
                ) +

              "</strong>" +

            "</div>" +


            "<div class='tracking-row'>" +

              "<span>Quantity</span>" +

              "<strong>" +

                escapeHTML(
                  order.quantity ||
                  "1"
                ) +

              "</strong>" +

            "</div>" +


            "<div class='tracking-row'>" +

              "<span>Filament</span>" +

              "<strong>" +

                escapeHTML(
                  order.filamentType ||
                  ""
                ) +

                " / " +

                escapeHTML(
                  order.color ||
                  ""
                ) +

              "</strong>" +

            "</div>" +


            "<div class='tracking-row'>" +

              "<span>Estimated completion</span>" +

              "<strong>" +

                (
                  order.eta
                    ? escapeHTML(
                        order.eta
                      )
                    : "Not set yet"
                ) +

              "</strong>" +

            "</div>" +

          "</div>";


      } catch (error) {

        result.innerHTML =
          "<div class='error-box'>" +

            escapeHTML(
              error.message ||
              "Could not find that order."
            ) +

          "</div>";

      }

    }
  );


/* =========================================================
   START
========================================================= */

updateOrderType();

loadShop();

</script>
