<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Staff - Friends & Family Prints</title>

  <link
    rel="stylesheet"
    href="style.css">

</head>


<body>

<header class="site-header">

  <div class="container nav">

    <a
      class="logo"
      href="index.html">

      Friends & Family Prints

    </a>

    <nav>

      <a href="index.html">
        Customer Site
      </a>

    </nav>

  </div>

</header>


<main>

<section class="section">

  <div class="container">

    <div
      id="loginScreen"
      class="staff-login">

      <div class="section-heading">

        <p class="eyebrow">
          STAFF
        </p>

        <h1>
          Staff Login
        </h1>

      </div>


      <form
        id="loginForm"
        class="form">

        <label>

          Staff Password

          <input
            id="password"
            type="password"
            required
            placeholder="Password">

        </label>


        <button
          type="submit"
          class="button">

          Login

        </button>


        <div
          id="loginResult"
          class="message">
        </div>

      </form>

    </div>


    <div
      id="dashboard"
      style="display:none">

      <div class="section-heading">

        <p class="eyebrow">
          STAFF PANEL
        </p>

        <h1>
          Dashboard
        </h1>

      </div>


      <div class="staff-actions">

        <button
          id="refreshButton"
          class="button">

          Refresh

        </button>


        <button
          id="logoutButton"
          class="button secondary-button">

          Logout

        </button>

      </div>


      <section class="staff-section">

        <h2>
          Orders
        </h2>

        <div
          id="orders"
          class="orders-list">

          Loading orders...

        </div>

      </section>


      <section class="staff-section">

        <h2>
          Inventory
        </h2>

        <div
          id="inventory"
          class="inventory-list">

          Loading inventory...

        </div>

      </section>


      <section class="staff-section">

        <h2>
          Gallery
        </h2>

        <div
          id="staffGallery"
          class="inventory-list">

          Loading gallery...

        </div>

      </section>

    </div>

  </div>

</section>

</main>


<footer class="footer">

  <div class="container">

    <p>
      Friends & Family 3D Prints
    </p>

  </div>

</footer>


<script src="staff.js"></script>

</body>

</html>
