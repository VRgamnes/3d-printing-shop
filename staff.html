<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Staff Panel</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

<header class="site-header">

  <div class="container header-inner">

    <h1>Print Shop Staff</h1>

    <button
      id="logoutButton"
      class="button"
      style="display:none"
    >
      Log out
    </button>

  </div>

</header>


<main class="container">


  <!-- LOGIN -->

  <section
    id="loginSection"
    class="panel"
  >

    <h2>Staff Login</h2>

    <form id="loginForm">

      <input
        type="password"
        id="password"
        placeholder="Staff password"
        required
      >

      <button
        class="button"
        type="submit"
      >
        Sign in
      </button>

    </form>

    <div id="loginResult"></div>

  </section>


  <!-- DASHBOARD -->

  <section
    id="dashboard"
    style="display:none"
  >


    <!-- ORDERS -->

    <div class="panel">

      <h2>Orders</h2>

      <button
        class="button"
        id="refreshOrders"
      >
        Refresh orders
      </button>

      <div id="ordersList"></div>

    </div>


    <!-- INVENTORY -->

    <div class="panel">

      <h2>Inventory</h2>

      <form id="inventoryForm">

        <input
          id="inventoryType"
          placeholder="Filament type"
          required
        >

        <input
          id="inventoryColor"
          placeholder="Color"
          required
        >

        <button
          class="button"
          type="submit"
        >
          Add filament
        </button>

      </form>


      <div id="inventoryList"></div>

    </div>


    <!-- GALLERY -->

    <div class="panel">

      <h2>Gallery</h2>

      <form id="galleryForm">

        <input
          id="galleryName"
          placeholder="Print name"
          required
        >

        <textarea
          id="galleryDescription"
          placeholder="Description"
        ></textarea>

        <input
          id="galleryImage"
          placeholder="Image URL"
        >

        <button
          class="button"
          type="submit"
        >
          Add print
        </button>

      </form>


      <div id="galleryList"></div>

    </div>

  </section>

</main>


<script src="staff.js"></script>

</body>

</html>
